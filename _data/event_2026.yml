- id: QDFTJY
  title: 'PipeLive: Using LLMs as Duct Tape to Craft a Self-Healing Pipeline'
  type: Presentation
  abstract: "We already know that LLMs can catch bugs, but what about fixing them
    autonomously, at scale, without disrupting production?\r\n\r\nTo investigate this
    hypothesis, this talk puts together an illustrative but very common scenario:
    a system that relies on a vulnerable library to handle untrusted user inputs across
    multiple service instances. By using canary deployments with built-in sanitizers,
    the system self-monitors for possible crashes and then, once a crash is identified,
    it feeds the dump into an LLM analyst harness. The harness then proceeds with
    root-causing the problem, implementing a patch for it and finally wrapping the
    patch into a live-patching unit. Libpulp, a userspace live-patching framework,
    completes the pipeline by applying these fixes across running production instances
    without service downtime.\r\n\r\nWhile the proposed pipeline system exists as
    a case-study PoC developed specifically for the talk, its development leveraged
    established open-source components such as libpulp, debugging tools and compiler-based
    sanitizers. In this talk, we plan to dive into each of these specific components,
    discussing all the technicalities around how they work, why they matter, and how
    all the steps can be connected and automated through the usage of LLMs, achieving
    a self-healing system."
  duration: 20
  speaker_ids:
  - AYQZQC
  do_not_record: false
- id: QTTVPD
  title: Retro Floppy Archive Project
  type: Presentation
  abstract: "I buy boxes of old floppy disks (3.5 and 5.25) off eBay and out of thrift
    stores, media people sold, donated, or threw away decades ago, sure that whatever
    was on them was long gone. It wasn't.\r\n  Across 7,000+ disks I've recovered
