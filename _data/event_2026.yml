- id: FWL33B
  title: One Request to Rule Them All
  type: Workshop
  abstract: "The world has changed...\r\n\r\nIt began with the forging of the modern
    enterprise. To the cloud were given vast kingdoms of compute. To the mobile apps,
    a presence in every pocket. To the machines that now think, knowledge stolen from
    the creators. And to bind them, to let each speak to each across the dark spaces
    between systems, the architects forged the APIs.\r\n\r\nBut in the forging a flaw
    was hidden. For an API answers any who ask it correctly, and it does not always
    stop to learn who is asking. So it came to pass that buried among ten thousand
    harmless calls there waited a single request. One request with dominion over all
    the others. One request to read what was meant to stay hidden, to act in the name
    of any user, to claim the powers kept for admins alone.\r\n\r\nOne Request to
    bring the whole realm to ruin, and in a single call, destroy it."
  duration: 120
  speaker_ids:
  - VJK3U7
  do_not_record: false
- id: GQJTHR
  title: Uncovering an Android dropper campaign
  type: Presentation
  abstract: "We tracked an Android malware campaign across multiple applications published
    on the official Android marketplace, including SMS messengers, games, PDF scanner,
    and phone-cleaning utilities. Although the apps appeared unrelated, each contained
    the same randomly renamed loader responsible for decrypting and executing a hidden
    payload.\r\n \r\nOver time, the operator constantly changed implementation details:
    payload execution methods, C2 protection mechanisms, packaging strategies, developer
    accounts, and application themes. In several cases, the dropper was embedded as
    a seemingly legitimate third-party SDK. These changes created the appearance of
    new malware families while the underlying operation remained the same.\r\n \r\nThis
    talk walks through the investigation process used to connect the samples and uncover
    the campaign. We will show why analyzing only the newest sample can lead to fragile
    detections when malware builders rotate techniques instead of evolving linearly,
    how common static-analysis workflows missed critical indicators, and which pivots
    ultimately revealed the relationships between samples.\r\n \r\nAttendees will
    leave with practical hunting and attribution techniques that can be applied to
    Android malware investigations, including package structure analysis, fuzzy-hash
    correlation, signing-time clustering, and methods for distinguishing meaningful
    pivots from misleading ones."
  duration: 20
  speaker_ids:
  - XWCGNA
  do_not_record: false
- id: GXRTZM
  title: How We Let an AI Agent Into Our Security Review Process (And What did we
    learn)
  type: Presentation
  abstract: Everyone assumes AI speeds up security review by automating the scan and
    the checklist. That’s not where the time was going. The real bottleneck is a scarce
    human reviewer and the back-and-forth of iterating a design until it’s actually
    reviewable. This talk is about what happens when you stop trying to make the machine
