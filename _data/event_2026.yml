- id: BQTYWT
  name: Pankaj Upadhyay
  biography: "Pankaj Upadhyay is a Principal Cybersecurity Engineer at Workday, where
    he focuses on secure architecture, threat modeling, and the emerging challenges
    of AI/ML security. He has been recognized across the industry through published
    CVEs, responsible disclosures, and inclusion in multiple security “Hall of Fame”
    acknowledgments (Google, Adobe, Cert-EU etc.) for his contributions to improving
    software security. \r\nWith a background spanning application security, cloud
    security, and open-source research, Pankaj’s recent work explores how generative
    AI and vision models can augment traditional security processes from automated
    threat modeling to adversarial testing of AI agents.\r\n\r\nAt BSidesPDX 2025,
    Pankaj shares his lessons learned from building an AI-assisted threat modeling
    agent that “sees” architecture diagrams and generates structured analysis automatically.
    His talk dives into what works, what breaks, and how AI can make threat modeling
    faster, more accessible, and actionable for modern engineering teams, if done
    with an interactive feedback loop and constant user engagement."
