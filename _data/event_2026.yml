- id: 3FFVPH
  name: Groucho Marxist
  biography: "A textual maximalist, Groucho Marxist once wrote an essay without any
    verbs in it about why people shouldn't use verbs. It remains her best-known work.
    SO FAR. \r\n\r\nAnd that includes the book chapter she wrote about _MST3K_. \r\n\r\nShe
    has a lot of diplomas, which she uses to conceal evidence of the fact that, although
    she is often described as \"an evil genius\" or \"a hilarious evil genius,\" she
    is still on her Learning How to Hang Shelves  ✨jOuRnEy✨. Just in case you saw
    her house and wondered if squirrels high on meth had chewed the walls (they haven't;
    her house squirrels prefer crack).\r\n\r\nWhen Groucho was tiny, her father plopped
    her in front of a Commodore 64 and called it parenting (The 80s were a different
    era). She learned what a syntax error was before she could tie her shoes. She
    learned some things. [redacted] [also redacted] [probably good to redact that
    one too] Commodore 128. `^[2-5]86$.` T5600. Intel Core i5. There were others that
    were less formative to her biography; pour out the overflowing stack in their
    memory because she can't remember them right now. \r\n\r\nAnyway, she's had a
    \"non-traditional\" career path, which is a normie-friendly way to avoid saying
    something like \"she's had a circuitous ✨jOuRnEy✨ back to cybersecurity,\" since
    a) \"circuitous\" is too \"load-bearing\" in that sentence, semantically and intellectually,
    and b) she's not, strictly speaking, employed in cybersecurity or anything else,
    really. \r\n\r\nGroucho has lived in one (1) palindromic ZIP code. She has never
    gotten a parking ticket. This one time, she accidentally stole dessert from Kathy
    Bates. \r\n\r\nBut she only did it once. \r\n\r\nGroucho gave the talk \"InQuorigible:
    Quora in Missing Persons OSINT\" at DEF CON 34 Recon Village. She's going to keep
    giving talks with bad puns and worse information about Quora (all of which is
    true) until somebody does something to make them stop being so evil. \r\n\r\nBut
    until that glorious day, she yearns only to deliver value to your shareholders!!"
  picture: https://cfp.bsidespdx.org/media/avatars/9RKEMC_PZWowie.webp
