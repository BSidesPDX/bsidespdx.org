- id: LJCVK9
  title: 'Your Sandbox Has an Identity Crisis: When Network Reachability Becomes Cloud
    Identity'
  type: Presentation
  abstract: "Cloud VMs routinely bootstrap powerful identities through the Instance
    Metadata Service (IMDS), where network reachability can become implicit evidence
    that a caller is entitled to the hosting VM's identity. Real-world metadata incidents
    show manifestations of this trust assumption through SSRF and privilege escalation
    risks. This talk focuses on a less obvious case: hostile sandboxed workloads.
    As AI agents and other untrusted workloads are increasingly executed inside cloud
    sandboxes, ensuring that these execution boundaries also enforce identity boundaries
    becomes critical. \r\n\r\nThe talk demonstrates how a Hyper-V isolated container
    running a hostile workload can acquire the hosting VM's managed identity through
    the host's networking path to IMDS—**even** when that workload is protected by
    a nested virtualization boundary with an isolated kernel and additional in-guest
    security controls are present. The talk examines why common mitigations such as
    networking controls, firewall rules and HTTP header requirements, while providing
    defense in depth against traditional metadata attacks, lose effectiveness for
    sandboxed nested workloads. Furthermore, the talk demonstrates the sandboxed workload
    scenario to showcase how traffic attribution is challenging and why simply blocking
    access to the metadata endpoints per-sandboxed container does not scale.\r\n\r\nFinally,
    Azure Metadata Security Protocol (MSP) is presented as an example of a protocol-level
    redesign that replaces implicit trust in network reachability with explicit authentication
    and authorization. MSP combines transparent eBPF interception, secure key establishment,
    deny-by-default authorization, and HMAC-based request authentication to IMDS.
    The design demonstrates how Zero Trust principles can be applied to identity bootstrapping
    while preserving transparent access for existing applications and establishing
    a stronger identity boundary around sandboxed workloads in the cloud."
  duration: 20
  speaker_ids:
  - K8KAGN
  do_not_record: false
- id: LYC8PM
  title: 'Good Boy: Turning Datadog into a C2 Channel'
