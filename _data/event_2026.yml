- id: 3SMKZE
  title: 'You wouldn''t hack a satellite: Breaking the Cubesat Space Protocol'
  type: Presentation
  abstract: 'CSP (Cubesat Space Protocol) is the main open-source networking protocol
    for Cubesats: Rubik''s cube-looking miniature satellites gaining popularity due
    to their reduced cost and development time. This talk presents a vulnerability
    research deep dive into libcsp, the most popular implementation of the protocol.
    It uncovers a wide variety of vulnerabilities ranging from a Mitnick attack-like
    TCP connection forgery, insecure primitives and memory corruption. The talk will
    also cover the vulnerability disclosure process and its challenges.'
  duration: 20
  speaker_ids:
  - KPWLX7
  do_not_record: false
- id: 3YPFT9
  title: Das Blinken
  type: Presentation
  abstract: "Join me as I discuss what is likely the most famous examples of blinken
    lights.  The CM-5/CM-500 super computer was featured in the background of Jurassic
    park due almost entirely to these lights.  I was in the right place and the right
    time to take part in decommissioning one such machine.\r\n\r\nIn this talk I'll
    briefly discuss thinking machines (the company), the connection machine (the super
    computer), and spend the rest of the time diving deep into the architecture of
    the board itself.  Reverse engineering revealed surprising choices taken on a
    project where money is no object.\r\n\r\nUltimately, we're left with the ability
    to display some graphics on the LEDs (I hope!) and having learned some interesting
    techniques."
  duration: 20
  speaker_ids:
  - J8DCAT
  do_not_record: false
- id: 7X7TUS
  title: No Model Was Harmed in the Making of This Exploit
  type: Presentation
  abstract: "In March 2026, people discovered Chipotle's customer-support chatbot
    would happily solve LeetCode problems and write Python between burrito orders.
    Within days someone had turned it into a free coding agent running entirely on
    Chipotle's compute. The internet laughed and moved on, and missed the actual lesson.\r\n\r\nThe
    uncomfortable part: nothing was hacked. No protocol cracked, no auth bypassed,
    no prompt injected. The \"exploit\" was a faithful reimplementation of the bot's
    own chat client, wrapped in one thing, an OpenAI-compatible API which instantly
    dropped a captive support bot into the entire LLM tooling ecosystem: every SDK,
    every agent, every framework.\r\n\r\nThis talk names that pattern interface laundering,
    and argues it's a latent property of nearly every AI feature shipping today. Your
    support bot, your \"summarize\" button, your semantic search: if it's reachable
    and returns model output, someone can re-present it through a standard interface
    and take it somewhere you never intended. The friction you're counting on as a
    control gets laundered away in about forty lines of code.\r\n\r\nWe'll walk the
    (now-patched) Chipotle case, watch a deliberately vulnerable bot get laundered
    into a coding assistant on video, and leave with a hardening checklist that assumes
    the attacker isn't a browser: where to enforce scope, why per-session rate limits
    are theater, and how to spot the \"phantom client\" whose absence of human fingerprints
    gives a proxy away."
  duration: 20
  speaker_ids:
  - XTUYM9
  do_not_record: false
- id: 8RSAC8
  title: Detecting Inlined Functions in Compiled Binaries Using a Graph Neural Network
  type: Presentation
  abstract: "Compiler optimizations can fundamentally change the structure and our
    understanding of how a binary runs under the hood, this makes binary analysis
    and reverse engineering much more difficult. One particularly important optimization
    is function inlining, where a compiler replaces a function call with the body
    of the function, usually stripping away the function name. This makes determining
    what function was originally contained in the program much more difficult.\r\n\r\nThis
    talk would explore our research into using Graph Neural Networks to detect function
    inlining in compiled binaries. We will examine how binary code can be represented
    in graphs, how compiler optimizations affects those representations, and how machine
    learning can be used to identify code that has been inlined. \r\n\r\nThe talk
    will focus on our approach and our results, while also providing the necessary
    background to understand our research. Our talk will explain why this is valuable
    for reverse engineering binaries, as well as identifying vulnerable functions
    and even finding CVEs. This is with the intent of furthering the cybersecurity
    landscape as currently detecting functions that have been inlined remains a problematic
    task. However, our method was able to detect inlined regions of a program 76%
    of the time. We will also touch on the limitations and future works of our research.
    \r\n\r\nAttendees will leave with an understanding of why compiler optimizations
    complicate binary analysis, how GNNs can be applied to reverse engineering problems,
    and the applications that this work has to software vulnerability analysis, reverse
    engineering, and malware analysis."
  duration: 20
  speaker_ids:
  - DFG7NV
  - VDMCQL
  do_not_record: false
- id: 9HCRZS
  title: 'From Edge Telemetry to Automated Defense: Mining WAF Logs with Python'
  type: Presentation
  abstract: "Web Application Firewalls (WAFs) log millions of website requests every
    day, but turning that data into real protection is slow and manual. Security teams
    spend endless hours digging through giant log files to write blocking rules by
    hand—often days after an attack has already started.\r\n\r\nIn this talk, I will
    show a free, open-source Python tool I built to fix this problem. My tool takes
    raw security logs from Fastly's Next-Gen WAF and uses machine learning to automatically
    group suspicious traffic by how it behaves, such as its timing or hidden patterns
    in the web requests. Once the tool spots a group of bad traffic, it automatically
    creates a ready-to-use blocking rule to stop the attack.\r\n\r\nI will demonstrate
    live how the tool scans gigabytes of log data, catches a hidden botnet, and creates
    a working defense rule in less than two minutes. Attendees will also get free
    access to my code repository."
  duration: 20
  speaker_ids:
  - UMRZP9
  do_not_record: false
