- id: M9PJU9
  title: 'Bring Your Own Trusted Caller (BYOTC): A New Way to Exploit Vulnerable Windows
    Drivers'
  type: Presentation
  abstract: "Bring Your Own Vulnerable Driver (BYOVD) is already well understood:
    attackers load a legitimate signed driver and abuse its privileged capabilities.
    This talk presents Bring Your Own Trusted Caller (BYOTC), a variant that can be
    more far-reaching than a single vulnerable-driver bug. Many drivers restrict powerful
    operations to a trusted user-mode client; if an attacker can control or impersonate
    that client, the driver's authorization check becomes a confused deputy. I have
    confirmed this pattern across several products, and the same design could affect
    dozens more drivers.\r\n\r\nI have published the first installment of my BYOTC
    research (https://xusheng.dev/posts/byotc/main/), which examines Malwarebytes
    Chameleon and System Informer. In this talk, I will present additional cases:
    a related process-hardening issue in VirtualBox; dynamic attestation replay in
    Avast; creator-controlled trusted clients in 360 Total Security, Huorong, and
    Antiy ATool; and a basename-based caller gate in HitmanPro.Alert. The cases show
    different ways an attacker can cross the same trust boundary, with demonstrations
    scoped to the operations each test actually proved.\r\n\r\nI will close by examining
    Microsoft's preview Windows Endpoint Security Platform (WESP). Moving antivirus
    enforcement out of the kernel can reduce some driver risk, but it does not automatically
    authenticate a client to a privileged service or preserve that client's runtime
    integrity. The BYOTC question remains wherever a privileged component trusts a
    client that an attacker can influence. Attendees will leave with a method for
    reviewing that boundary in both drivers and user-mode security services."
  duration: 20
  speaker_ids:
  - BPETWL
  do_not_record: false
- id: MGU9TP
  title: 'LLMs vs. Crypto: The Crypto Arms Race in Modern Ransomware'
  type: Presentation
  abstract: "Ransomware groups have historically relied on well-understood encryption
    to lock victims out of their data. But a new generation of families is deploying
    cryptographic schemes of surprising sophistication, far exceeding what's needed
    to prevent decryption. The Kyber ransomware combines hybrid post-quantum key encapsulation
    mechanism alongside elliptic curve key exchange for symmetric key derivation,
    seeded by multiple independent entropy sources. It is designed to resist quantum
    computers that don't yet exist. CRY0 implements an uncommon authenticated cipher
    paired with a dual-layer asymmetric key wrapping scheme using a modified Chinese
    national cryptographic standard, that enforces mutual distrust between operators
    and affiliates, preventing either party from decrypting files alone. A third family
    is AiLock, which explicitly markets itself as \"AI-assisted\" and wraps file keys
    with a different post-quantum algorithm, yet ships with implementation flaws that
    suggest the developers may not fully grasp the cryptography they adopted. This
    level of implementation complexity, and the mistakes they incur, would have been
    impractical for most malware developers just two years ago, which makes us question
    whether AI-assisted development tools are enabling threat actors to reach beyond
    their traditional capabilities.\r\n\r\nThis talk dissects the encryption architectures
    of these families, analyzes why this complexity is operationally unnecessary,
    and investigates the indicators of the AI-assisted development hypothesis. It
    then turns to the defensive side: the author shares a practical field report on
    using LLMs as reverse engineering co-pilots against these same families, documenting
    where they proved invaluable and where they consistently fell short. The emerging
    picture suggests an asymmetry worth examining: current AI tools may lower the
    bar for building complex malware more than they lower it for analyzing it."
  duration: 20
  speaker_ids:
  - U9WSFL
  do_not_record: false
- id: MQREX8
  title: 'Second Set of Eyes: AI-Accelerated Security Analysis Without Giving Up the
    Wheel'
  type: Presentation
  abstract: "Security analysts do not have a shortage of information. Vulnerability
    findings, threat intel, compliance requirements, audit evidence, and a growing
    stack of SaaS tools all compete for the same finite attention. Somewhere in that
    flood we're still expected to make sound risk decisions. \r\n\r\nThis talk skips
    the \"should security use AI?\" debate and ask a narrower, more useful question:
    can AI make the analyst faster without becoming the analyst? \r\n\r\nDrawing on
    hands-on security work, I will walk through three real use cases where AI has
    meaningfully sped up my process bit have deliberately kept it out of the driver's
    seat: \r\n\r\nVulnerability exposure research - using AI to structure the investigation
    into exploitability and blast radius, not to declare severity \r\n\r\nCompliance
    analysis - using AI to develop compliance requirements into evidence, questions,
    and gaps to cut audit evidence gathering time. \r\n\r\nShadow AI / SaaS risk review
    - turning a pile of vendor documentation into a structured set of data-handling
    and third-party processing questions \r\n\r\nEach example follows the same workflow:
    research, correlate, identify what is missing, analyze, verify, decide, and document.
    AI can take on the analyze and verify work while not touching the verify or deciding.
    \r\n\r\nThis talk also covers where this AI is less useful. For example, AI's
    tendency to sound confident while missing context or why a polished wrong answer
    can be more dangerous than an obviously wrong one. Attendees will leave with a
    practical framework for where AI genuinely helps a security analyst's workflow
    and how to keep human judgment in the loop without losing the speed gains. \r\n\r\nThis
    is not an AI-evangelism talk or an AI-skeptic talk, but a practitioner's field
    report on where the line actually sits. \r\n\r\nNotes for reviewers: All examples
    come from real practitioner work; vendor names and specific findings will be genericized
    or represented rather than shown as confidential material. Demos use recorded/screenshotted
    walkthroughs where live data isn't"
  duration: 20
