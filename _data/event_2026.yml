- id: RBNNH7
  title: Phishing With Misfortune Cookies - Onsite Social Engineering And Exploiting
    Assumed Trust
  type: Presentation
  abstract: Within physical social engineering, exploiting assumed trust is key. You
    need to dress the part, know the lingo, and make anyone who looks your way think
