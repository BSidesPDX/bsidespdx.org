- id: QZGQRF
  title: Delete Your Data in the Age of AI
  type: Presentation
  abstract: "Four years ago, Delete Your Data came to BSidesPDX to talk about reducing
    your online footprint and exercising your privacy rights. Since then, AI has changed
    the threat model, and we’ve rebuilt our approach around agents that help protect
    you from other people’s agents.\r\n\r\nOur founding principle is that everyone
    should have a meaningful say in what happens to their information. Or, as the
    hipsters say, “Consent is sexy.”\r\n\r\nDelete Your Data helps you ask companies
    to remove your information on your terms. A lawyer reviews the request, the company’s
    response, and the available evidence. If your information shows up again after
    a company says it has been removed, our sharky litigator friends will help you
    decide what to do next.\r\n\r\nWe’ll show how agents can help find exposed information,
    prepare and track deletion requests, follow up with companies, and organize the
