- id: KE9T3K
  title: 'BGP: A Gateway to Insecure Insanity: Why the internet works and when it
    doesn''t.'
  type: Presentation
  abstract: "Border Gateway Protocol (BGP) is the foundation of Internet routing,
    enabling networks around the world to exchange information about how traffic should
    reach its destination. Yet BGP was designed around trust, and that trust can be
    exploited.\r\n\r\nIn this talk, I will introduce the fundamentals of BGP, explain
    how route advertisements influence Internet traffic, and examine what happens
    when those advertisements are incorrect or malicious. We will explore several
    notable cases of nation-state-sponsored BGP hijacking, including incidents affecting
    services such as YouTube, Apple, Telegram, and others.\r\n\r\nThe talk will then
    examine the mechanisms used to detect and defend against BGP hijacking, including
    the role of routing security practices and the challenges involved in deploying
    them at Internet scale.\r\n\r\nFinally, I will present a short case study examining
    university network prefixes and their exposure to BGP hijacking. Using an experimental
    methodology, we analyze the likelihood of several university prefixes falling
    victim to a BGP hijack. Specifically we’ll examine: University of Oregon, Portland
    State University, Utah State University, Stanford University, and others."
  duration: 20
