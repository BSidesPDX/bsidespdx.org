- id: AUPPNS
  title: Theory and Practice of Intercepting Voice Radio Transmissions
  type: Workshop
  abstract: "As long as people have been talking on two-way radios, other people have
    wanted to listen to them. But where do you begin? Radio comms rely on practices
    and jargon to optimize communication in a domain where you can't transmit only
    to the person you want to talk to, you don't know if your transmission can reach
    them, or if their transmissions can reach you.\r\n\r\nIf you simply eavesdrop
    on people talking on the radio, you'll probably have no idea what they're talking
    about. This workshop will first teach you how to effectively communicate on the
    air so that you can understand the transmissions that you will also learn to intercept
    — within the bounds of the law.\r\n\r\nYou will learn the basics of handheld radio
    operation, radio language and etiquette, and use them to actually communicate
    on the air. Then we'll cover how to identify frequencies used and intercept them
    using low-cost, off-the-shelf equipment, including directional antennas and software-defined
    radio (SDR). Finally, we'll explore the limits of radio interception, including
    dealing with trunking systems and encrypted comms.\r\n\r\nThis is going to be
    a cool as hell workshop where we will learn by doing. No radio experience is expected
    or required! Folks who have never so much as held a walkie-talkie are strongly
    encouraged to participate. You just have to be ready to go outside — rain or shine!"
  duration: 120
  speaker_ids:
  - MWHAWX
  do_not_record: false
- id: BKWD8E
  title: 'InQuorigible: Quora in OSINT'
  type: Presentation
  abstract: "We all know Quora - or do we? Like Internet herpes, if you're a Google
    user, it'll follow you, forever, haunting your inbox with clickbait if you ever
    so much as click on a Quora result while logged into Google.\r\n\r\n...But do
    we _REALLY_ know Quora (or want to?)? Because, despite Quora being a pustule on
    the Internet that exists for the sole purpose of spamming SERPs, you'll be shocked
    to learn that it's also got - spoiler alert!!! - a dark, seedy underbelly. One
    that I uncovered while volunteering on an MP investigation. One that can yield
    surprising, disturbing and useful intelligence.\r\n\r\nSure, hating on Quora is
    low-hanging fruit (I'm short), but it's got implications for OSINT and security
    overall. \r\n\r\nIn this talk, I'll explain:\r\n\r\n1. The toxic intersections
    of business strategy, platform policies, SEO, and socioeconomics that drive certain
    market segments to Quora in much higher numbers than you assumed\r\n2. Why Quora
    benefits from tombstoning content (including content with minors' PII) instead
    of actually deleting it\r\n3. How to investigate Quora Quontent, which anyone
    can do, because it's all served up completely legally in a grotesque tangle of
    GraphQL; hell, most of it is right there in the UI.  \r\n4. OWASP API and Mitre
    ATT&CK (R) CWE categorization for Quora's approach. \r\n5. What I think the OSINT
    community should do (hint: something. Anything!). \r\n6. Quora's silence on the
    issue. Well, I can't actually _explain_ it since it's inexplicable to me, but
    I'll totally _describe_ that silence. \r\n\r\nI don't want this talk to end with
    pitchforks out and an angry mob marching towards headQUORters. I'd prefer a nice
    conversation of professionals generating ideas for remedying this Quorrible situation
    and a greater understanding of how to avoid disclosure of sensitive data when
    building with similar tools. \r\n\r\nBut pitchforks might be fun, too. \r\n\r\n(Just
    kidding! I in no way condone violence or even the use of farming tools for anything
    other than old-timey farming!) \r\n\r\nThis talk was presented at DEF CON 34's
    Recon Village (https://reconvillage.org/reconvillage-2026-defcon-34/talks/inquorigible-quora-in-missing-persons-osint).
    The original focus was on how to use Quora for missing persons investigations,
    but my research has since broadened; Quora can be used for MP investigations as
    well as investigating black hat marketing, psyops, \"and much, much more!\" from
    your nightmares."
  duration: 20
  speaker_ids:
  - 3FFVPH
  do_not_record: false
- id: C3BVBM
  title: Privacy Challenges in Parenting
  type: Presentation
  abstract: "Privacy policies are opaque documents, often loaded with obfuscating
    legalese, but they have real-world consequences for ourselves, our community,
    and the next generation. During this presentation we'll explore the the current
    state of privacy as it applies to young people. We'll discuss how schools factor
    in and how the data-broker industry is starting young. We'll consider the real-world
    impacts of data breaches and how the people selling toys manipulate us when we're
    just trying to let our kids play. We'll wrap up with where we can go next, and
    how we can promote policy solutions to address this difficult problem.\r\n\r\n\"Think
    of the kids\" doesn't just have to be a political slogan, it can be a rallying
    call to make the world safer and more private for us all. Join the conversation
    to learn how to advocate for the young people in your family and our communities."
  duration: 20
  speaker_ids:
  - 7CJ3WK
  do_not_record: false
- id: CKSPHF
  title: Why You (Still) Need SBOMs
  type: Presentation
  abstract: In the wake of all the AI news over the course of the year, you would
    think that the lowly Software Bill of Materials is not something you should pay
    attention to anymore. But as basic as the concept of an SBOM is, it is very difficult
    to implement in our modern software development lifecycle, and as such, difficult
    to realize the gains from it. This talk is about why you still need to pay attention
    to software metadata inventory and sharing, especially in the age of AI! We will
    see the security benefits of SBOM for a simple app, then watch as the complexity
    grows for our modern software stack. You will come away with some simple implementation
    tactics that will reduce the complexity of maintaining SBOMs while reaping the
    benefits.
  duration: 20
  speaker_ids:
  - UHMZAH
  do_not_record: false
- id: D73H9J
  title: 'Beyond Static Secrets: Building Verifiable Workload Identity with SPIFFE
    and SPIRE'
  type: Presentation
  abstract: "Modern applications depend on communication among microservices, containers,
    virtual machines, APIs, and AI agents operating across dynamic, multi-cloud environments.
    Yet many workloads still authenticate using long-lived API keys, shared secrets,
    manually managed certificates, or network location, controls that become difficult
    to secure and rotate at scale.\r\n\r\nThis presentation introduces SPIFFE, an
    open standard for assigning cryptographically verifiable identities to software
    workloads, and SPIRE, its production-ready implementation. Attendees will follow
    the identity journey of a workload: from node and workload attestation to receiving
    a short-lived identity document and establishing authenticated service-to-service
    communication.\r\n\r\nParticipants will learn how to identify appropriate SPIFFE
    use cases, define trust domains and SPIFFE IDs, replace embedded credentials with
    automatically rotated identities, and connect workload authentication to authorization
    policy. They will leave with a practical framework for evaluating and piloting
    SPIFFE in Kubernetes, multi-cloud, service-mesh, and other distributed environments."
  duration: 20
  speaker_ids:
  - 8TPVXV
  do_not_record: false
- id: ERJQXJ
  title: 'Telemetry to Detection: A Practitioner’s Guide to detection.wiki'
  type: Presentation
  abstract: "Security practitioners often need to quickly answer questions like: What
    telemetry records this activity? What fields should I investigate? What does the
    event actually look like? Has anyone already documented or detected this behavior?\r\n\r\nThis
    talk introduces a searchable catalog of security telemetry and more than 16,000
    public detection rules. I’ll show practical ways threat hunters, incident responders,
    SOC analysts, SIEM engineers, and security engineers can use it to research unfamiliar
    events, identify useful telemetry, investigate suspicious behavior, and compare
    detection approaches.\r\n\r\nAttendees will leave with several practical workflows
    they can immediately use during investigations, hunts, SIEM work, and daily security
    operations."
  duration: 20
  speaker_ids:
  - REFV8W
  do_not_record: false
- id: F8KUG8
  title: 'Banned Book Library: A Cyberpunk Dead Drop'
  type: Presentation
  abstract: "Imagine you live in a dystopian cyberpunk future in which the world is
    increasingly controlled by big tech monopolies working in lock-step with an increasingly
    fascist government. It's not unrealistic to think that such a system might attempt
    to prevent its citizens from accessing certain written materials in order to prevent
    the spread of \"unwanted\" ideas. In the United States, \"book bans\" typically
    involve public and school libraries being required to stop stocking certain books.
    Books are not banned in the sense that they can still be produced, sold, and owned.
    However, there are countries that do ban and censor books today.\r\n\r\nIn this
    talk, I will show you how you can repurpose an inexpensive esp32-based WiFi-enabled
    light bulb and turn it into a cyberpunk dead drop used to wirelessly share books
    and materials your government doesn't want you to see. Or you can host cat pictures.
    Or both!"
  duration: 20
  speaker_ids:
  - JKASZM
  do_not_record: false
- id: FBPFQG
  title: 'Catch Me If You Can: Stealing OAuth Tokens with an Interception Attack'
  type: Presentation
  abstract: "OAuth 2.0 is the industry standard for delegated authorization. It allows
    a client to access a secured resource on behalf of a user without exposing the
    user’s password. Properly implemented, OAuth can provide robust security for your
    sensitive data. But done wrong, your application could be vulnerable!\r\n\r\nOne
    such vulnerability is an interception attack. This is where a malicious actor
    can intercept an OAuth token over the network. The token can then be used to impersonate
    a client, giving the actor access to a resource they're not supposed to have.\r\n\r\nIn
    this talk I'll first give a high level overview of OAuth. Then I'll demo how to
    perform an interception attack on an application which has implemented OAuth insecurely.
    Then finally, I'll show how to secure an OAuth authentication flow to make an
    interception attack difficult to pull off.\r\n\r\nAttendees will leave this talk
    with a high level understanding of what OAuth is, where it can be vulnerable,
    and how to implement it securely in their applications."
  duration: 20
  speaker_ids:
  - F7SBWG
  do_not_record: false
- id: FCMQFP
  title: 'VibeCheck: Failed'
  type: Presentation
  abstract: "Someone at your company just prompted an app into existence. Someone
    outside your company can do the same with your logo and a login form. Neither
    needs to register a domain. So how are you supposed to find either of them?\r\n\r\nI
    started with the platforms. VibeCheck grew into more than 176.5 million observed
    hostnames and 100,000+ screenshot captures across AI builders and the publishing
    infrastructure around them. We’ll get into Base44, Lovable, Bolt, Emergent and
    friends: how we found their app hostnames, what DNS fingerprints they leave behind,
    and how to follow those clues onto custom domains. I’ll also show how we put a
    bunch of laptops in my home lab to work, splitting discovery, OCR and screenshot
    review across an agent swarm.\r\n\r\nOnce you start looking at the pages, you
    find things a company probably wants to know about. Clinical caseboards linking
    names to procedures. Loan-approval screens displaying borrower details and credit
    decisions. Administrator usernames and passwords printed beside the login form.
    Is this real business data? A demo? Something somebody meant to share? We’ll work
    through what helps us tell the difference, where those clues get shaky, and what
    we’d need to check next.\r\n\r\nThen there’s the abuse: corporate and mailbox
    login clones, billing forms asking for card details and Social Security numbers,
    verification pages requesting phone codes, wallet download and recovery lures,
    and pay-first offers promising a bigger payout. A Ledger support form asks for
    recovery words while warning never to share them. An FBI-branded “support center”
    claims verified government status and sends visitors to Telegram. We’ll examine
    what these pages ask people to hand over—and compare them with legitimate brand-controlled
    assets using the same platforms.\r\n\r\nI’ll show how we found these, why they
    deserve attention, and what we’d check next. You’ll leave with a workflow you
    can use yourself, free OSINT starting points, and historical and reverse-DNS pivots
    that help move an investigation forward. I’ll also share a large screenshot library
    of some of the worst examples, with capture dates and investigation notes, so
    you can dig well beyond what fits into 20 minutes."
  duration: 20
  speaker_ids:
  - 8WTVDM
  do_not_record: false
- id: FJ7ZTF
  title: We run a community hackerspace, AMA
