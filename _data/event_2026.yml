  title: 'Trust the Output, Board the Ship: Why AI Security Workflows Fail in Production'
  type: Presentation
  abstract: 'When an AI-assisted query nearly caused special forces to board a commercial
    vessel based on false reports of nuclear cargo, commentators blamed model hallucination.
