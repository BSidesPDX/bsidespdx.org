- id: TMRAPB
  title: Is North Korea in Your node_modules?
  type: Presentation
  abstract: "Earlier this year, a contributor tried to smuggle North Korean malware
    into Better-Auth, the popular JS auth library, through pull requests that shipped
    real, requested features. Buried between the legitimate changes sat an obfuscated
    payload in the build config. It fires the moment anyone runs npm run dev, pulls
    encrypted second and third stage payloads from blockchain transactions, and spawns
    a hidden process that keeps running after your build exits with code 0. We caught
    it, reverse engineered all three stages, and found the same malware signature
    in 30+ other repos on GitHub.\r\n\r\nThis talk is a live teardown of the full
    attack. You'll see how the malicious code hides off-screen in GitHub's default
    diff view (try scrolling right sometime), how a 37-character scrambled string
    decodes to constructor so the payload can build executable code that no static
    scanner catches, why hosting malware on a blockchain means it can never be taken
    down, and what the C2 server steals first. Spoiler: OPENAI_API_KEY is near the
    top of the list, right next to your AWS creds and GitHub token.\r\n\r\nLiteLLM
    and axios were hit by supply chain attacks the same week. If you ship on open
    source, this pattern is already aimed at you. You'll leave knowing exactly what
    to grep for in your own dependencies."
  duration: 20
  speaker_ids:
  - TCDCU3
  do_not_record: false
- id: TPSD7K
  title: Reverse Engineering A Camera/Lens Control
  type: Presentation
  abstract: "Modern (detachable) camera lenses are engineering and optics marvels
    \ with light speed autofocus and incredible optical qualities. To enable this
    versatility, most camera systems no longer have lenses with manual controls.\r\nWhere
    a vintage lens can be repurposed or adapted to various camera systems with a simple
    adapter, modern electronic lenses are useless when detached from their particular
    camera. \r\n\r\nLong ago, the author has settled onto Sony camera ecosystem and
    has amassed a collection of excellent lenses but their proprietary camera-lens
    communication protocol limits their use. By employing common hardware and software
    reverse engineering tools and techniques, I was able to reconstruct the signaling,
    timing and messaging details of this protocol and implement a controller that
    behaves like a camera does. This makes it possible to use these fancy lenses in
    custom DIY project such as a Raspberry Pi based camera. \r\n\r\nI will present
    the tools and techniques employed, stumbling blocks encountered and results achieved.
    I will be open-sourcing an implementation of the protocol that enables focus and
    zoom control of Sony e mount lenses via python and C via GPIO."
  duration: 20
  speaker_ids:
  - XTJZJ7
  do_not_record: false
- id: TZCK8D
  title: 'The Prince and the Prompt: Automating Chaos for Email Scammers'
  type: Presentation
  abstract: 'Scammers prioritize speed and human interaction; our solution prioritizes
    automated distraction. This talk details a novel adversarial defense strategy:
    deploying Large Language Models (LLMs) to functionally waste the time of fraudsters.
    We begin by analyzing the history of scam tactics and the mechanics of scambaiting,
    establishing the threat landscape. We then dive deep into the implementation:
    a practical proof-of-concept system built with Ollama and Go that automates the
    engagement and confusion of fraudulent communications. Crucially, we demonstrate
    that powerful defense can be resource-efficient, showing how this agent was successfully
    deployed on a modest stack, an email service and a laptop with a modest GPU. The
    presentation culminates in the results, showcasing the hilarious outcomes that
    prove our AI successfully turns the tables, ensuring scammers waste their time
    on digital nonsense instead of real victims.'
  duration: 20
  speaker_ids:
  - DHJ8DN
  - 9X3YPY
  do_not_record: true
- id: TZYRYG
  title: 'Building a Primitive-First LLM Security Framework: An Alternative to Tool-Wrapping
    and Narrative Triage'
  type: Presentation
  abstract: "Most attempts to automate code auditing with LLMs follow a familiar pattern:
    provide more context, add external tools, and ask the model to produce findings.
    While this approach can generate vulnerability reports, it often struggles to
    produce repeatable and trustworthy security assessments.\r\nThis talk presents
    lessons learned from building an LLM-assisted security auditing pipeline and the
    architectural shifts that emerged when common assumptions failed. Larger context
    windows reduced reliability, verification collapsed when discovery and validation
    were combined, and agent-style workflows frequently produced plausible but difficult-to-verify
    narratives.\r\nThe resulting primitive-first approach decomposes analysis into
    structured evidence objects and recomposes findings from independently validated
    relationships, reducing inference, improving traceability, and enabling more trustworthy
    AI-assisted security reviews."
  duration: 20
  speaker_ids:
  - MYWZQ8
  do_not_record: false
- id: UUAZKV
  title: 'Missing: Live-Playing an ARG-Style CTF'
  type: Workshop
  abstract: "CTFs. The thrill of getting a flag is unmatched, but the narratives tend
    to be … flat. But they don't have to be! Play an analog-horror, ARG-style capture-the-flag
    set in the heart of Denver. OSINT, cryptography, web application vulnerabilities
    unlock a story about how a fictional man went missing (mostly) without a trace.
    \r\n \r\nA bit of background regarding the story and infrastructure will be shared
    before opening it up for live play. The difficulty ranges from easy to medium
    but experience is not necessary (non-cyber participants were able to solve this
    as well)! Participants learn practical OSINT, cryptography, network enumeration,
    and web-security techniques by solving an interconnected narrative CTF."
  duration: 120
  speaker_ids:
  - YGKVYN
  do_not_record: false
- id: VAC9ZS
  title: 'Translating Cybersecurity Expertise into Community Practice: Lessons from
    Minneapolis Mutual Aid Work'
  type: Keynote
  abstract: "Cybersecurity is often framed as a discipline focused on protecting corporations,
    governments, and critical infrastructure. For many professionals in the industry,
    the work stops there. Yet these same skills used to defend enterprise systems
    can also be leveraged to support vulnerable communities, grassroots organizers,
    and mutual aid networks. This reframes cybersecurity knowledge as something that
    is not solely confined to corporate settings, but instead applicable to broader
    and more impactful community efforts. When these skills are shared in service
    of the greater good, they help bridge the gap between industry professionals and
    the general public, advancing social justice in an increasingly digital world.\r\n\r\nThis
    talk examines how grassroots anti-surveillance efforts, which emerged in response
    to intensified immigration enforcement operations in Minneapolis, MN, can inspire
    cybersecurity professionals to apply their expertise toward broader mutual aid
    initiatives. Using a real-world case study of teaching civilians and organizers
    the fundamentals of cyber hygiene, mobile security, and government surveillance
    awareness in a warehouse basement during the ICE occupation this past winter,
    the presentation demonstrates the meaningful impact that can occur when technical
    knowledge extends beyond corporate environments and into local communities. By
    the end of the session, attendees will leave with a deeper understanding of the
    social implications of digital security, stronger strategies for presenting cybersecurity
    education in digestible formats, and inspiration to use their technical expertise
    to support collective care and community resilience. Participants may even leave
    with a few workshop ideas of their own to bring back to their communities."
  duration: 60
  speaker_ids:
  - YKRWQF
  do_not_record: true
- id: R7E8JN
  title: BSidesPDX... How did we get here?
  type: Keynote
  abstract: "This is the 15th BSidesPDX, so we'll take a walk back into the history
    behind the conference\r\nEsteban, along with other members of the founding crew
    will start off with a bit about why the conference came to be, and what their
    original vision was - and how it turned out.\r\nThen we'll hear from several other
    past organizers about how the event grew and evolved over the years.\r\nFinally,
    we'll wrap up with this panel-of-panels with the current organizing crew to share
    what went in to making this year's event happen."
  duration: 60
  speaker_ids:
  - VSZCUD
  - KBFGKU
  - UHDCVF
  - 8M93HL
  do_not_record: false
- id: VEMXEJ
  title: How to catch your agent in a lie
  type: Presentation
  abstract: AI assistants summarize their work at the end of handling a prompt, but
    they often omit important details. Even worse, they can be tricked into hiding
    details when they've been hacked. I wanted a tool that deeply monitors process,
    filesystem, and networking usage when my assistants work. That's why I created
    Dex, a POC auditing tool, which makes it easy to understand what my assistants
    actually did between prompts. Dex is like Little Snitch for AI, but it goes further,
    including deep L7 network inspection of model and tool requests, child process
    tracking, and filesystem access. In this talk, we'll use Dex to take a closer
    look at how AI agents work under the covers, including process and networking
    mechanisms, to see how agents can disguise their work while leaving an audit trail
    if you have the right monitoring tools in place.
  duration: 20
  speaker_ids:
  - ELYJQK
  do_not_record: false
- id: VTNVQK
  title: What I would do if I had to start my offensive cybersecurity journey today
  type: Presentation
  abstract: Some of the most prominent conversations I hear from new grads and current
    students is, what do I focus on, how do I get a job in offensive cyber security,
    and why is everything on fire. We don't have time for that third bullet point,
    but I plan to talk about the first two through the lens of what I would do if
    I had to start fresh today.
  duration: 20
  speaker_ids:
  - 7MEFMZ
  do_not_record: false
- id: XVDPGD
  title: 'ForesightOps - Automate Remediation before vulnerability reaches code: Not
    another security scanner'
  type: Presentation
  abstract: Developers constantly live in fear of CI/CD supply chain attacks or vulnerabilities
    causing damage in an unrecoverable way. The real question isn’t, “was my repo
    affected?” instead it’s, “what could the attacker actually gain, or reach given
    the affected workflow run’s token scope and permissions?” Currently, a developer
    does this manually by checking permissions across all repositories case by case
    and analyzing the impact. This talk presents a way to automate the process by
    introducing a tool that checks the exact token scope and permissions that run
    had during the compromise window, checks what’s reachable, identifies exposed
    secrets, and determines whether lateral movement to other workflows or repos is
    possible or not. After analyzing it will list the impact with risk score and remediation
    to prevent the blast radius from further increasing.
  duration: 20
  speaker_ids:
  - ZKVGP9
  do_not_record: false
